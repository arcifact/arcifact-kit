# Build a release, sign it keylessly, and attach the bundle.
#
# The kit shipped tarballs with a sha256 beside them. A digest served
# from the same place as the artefact proves the bytes did not change in
# transit. It says nothing about who produced them, because anybody who
# can replace the tarball can replace the digest.
#
# Sigstore signs against an OIDC identity and records the signature in a
# public transparency log. There is no key to lose, and a forged
# signature is publicly detectable rather than merely denied.
#
# The identity is this workflow in this repository, so `cosign
# verify-blob` binds an artefact to the run that built it rather than to
# a person who could be impersonated.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build"
        required: true

permissions:
  contents: write
  id-token: write        # required for keyless signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: the suite must pass before anything is built
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q

      - name: name the version once
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: build
        run: |
          V="${{ steps.v.outputs.ver }}"
          # Exclude what a recipient does not need and must not receive.
          # AN ALLOWLIST OF PATHS OMITTED WHAT THE TESTS NEED.
          #
          # v1.3.0 shipped without examples/, SECURITY.md, CHANGELOG.md
          # and the manifests the suite reads. Extracted, it scored 39
          # passed and 25 failed, so the release provided genuine
          # Sigstore provenance for defective bytes. That is worse than
          # no signature: it attests to something broken.
          #
          # Ship everything except what a recipient must not receive,
          # and normalise the metadata so the archive is reproducible.
          tar --exclude-vcs \
              --exclude='.github' \
              --exclude='__pycache__' \
              --exclude='.pytest_cache' \
              --exclude='.secrets' \
              --exclude='*.pem' \
              --sort=name \
              --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH:-0}" \
              -czf "arcifact-kit-${V}.tar.gz" .
          sha256sum "arcifact-kit-${V}.tar.gz" \
            > "arcifact-kit-${V}.tar.gz.sha256"

      - name: test the exact bytes that will be signed
        run: |
          # THE GATE THAT WAS MISSING. The workflow tested the source
          # tree and then signed a different archive. Nothing ever
          # extracted what it signed and ran the suite against it.
          V="${{ steps.v.outputs.ver }}"
          rm -rf /tmp/extracted && mkdir -p /tmp/extracted
          tar xzf "arcifact-kit-${V}.tar.gz" -C /tmp/extracted
          cd /tmp/extracted
          python3 -m pip install --quiet pytest 2>/dev/null || true
          python3 -m pytest -q
          echo "the extracted archive passes its own suite"

      - name: refuse to ship a credential
        run: |
          V="${{ steps.v.outputs.ver }}"
          # A second, dumber layer than the tar exclusions. If any of
          # these reach the archive the release stops rather than
          # warning, because a release that exists is a release somebody
          # will download.
          if tar -tzf "arcifact-kit-${V}.tar.gz" | grep -Eq \
             '(^|/)\.(secrets|env)(/|$)|\.(pem|key|p12|pfx)$|id_rsa|credentials'; then
            echo "REFUSED: credential-shaped member in the archive"
            tar -tzf "arcifact-kit-${V}.tar.gz" | grep -E \
              '(^|/)\.(secrets|env)(/|$)|\.(pem|key|p12|pfx)$|id_rsa'
            exit 1
          fi
          echo "no credential-shaped members"

      - uses: sigstore/cosign-installer@v3

      - name: sign the built bytes
        run: |
          V="${{ steps.v.outputs.ver }}"
          cosign sign-blob --yes \
            --bundle "arcifact-kit-${V}.tar.gz.sigstore.json" \
            "arcifact-kit-${V}.tar.gz"

      - name: verify what we just signed
        run: |
          V="${{ steps.v.outputs.ver }}"
          # Signing and not verifying leaves a bundle nobody has proved
          # is checkable. This runs the exact command the README tells a
          # recipient to run.
          cosign verify-blob \
            --bundle "arcifact-kit-${V}.tar.gz.sigstore.json" \
            --certificate-identity \
              "https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}" \
            --certificate-oidc-issuer \
              "https://token.actions.githubusercontent.com" \
            "arcifact-kit-${V}.tar.gz"

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          files: |
            arcifact-kit-*.tar.gz
            arcifact-kit-*.tar.gz.sha256
            arcifact-kit-*.tar.gz.sigstore.json
          body: |
            Signed with Sigstore keyless. No key exists to lose, and the
            signature is recorded in a public transparency log.

            Verify before trusting:

            ```
            cosign verify-blob \
              --bundle arcifact-kit-${{ steps.v.outputs.ver }}.tar.gz.sigstore.json \
              --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ steps.v.outputs.tag }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              arcifact-kit-${{ steps.v.outputs.ver }}.tar.gz
            ```

            The identity is the workflow, not a person. That binds the
            artefact to the run that built it.

            The `.sha256` is still attached and still only proves the
            bytes did not change in transit. Anybody who can replace the
            tarball can replace the digest; only the signature says who
            produced it.

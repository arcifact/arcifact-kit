name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: pip install pytest pyyaml jsonschema pynacl
      - name: Bank integrity (digests, no strays)
        run: python tools/verify_hashes.py
      - name: Bank UID uniqueness
        run: |
          python - <<'PY'
          import json, pathlib
          for f in pathlib.Path("banks").glob("*.jsonl"):
              u = [json.loads(l)["u"] for l in f.read_text().splitlines() if l.strip()]
              assert len(u) == len(set(u)), f
          print("all bank uids unique")
          PY
      - name: Scorer smoke (abstain baseline, coverage reported)
        run: |
          python tools/grade_public.py banks/eval_autocsv.jsonl \
            examples/abstain_baseline_eval_autocsv.jsonl | tee out.json
          python - <<'PY'
          import json
          d = json.load(open("out.json"))
          assert d["n"] == 40 and d["fabrication_rate"] == 0.0, d
          assert "coverage" in d and "duplicate_n" in d, d
          PY
      - name: Scorer parity (gold labels score 1.0, strict, every bank)
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          for bank in sorted(pathlib.Path("banks").glob("*.jsonl")):
              rows = [json.loads(l) for l in bank.open()]
              perf = "".join(json.dumps({
                  "u": r["u"],
                  "response": f"POSSIBLE: {r['g']['resolver_possible'][0]}\n"
                              f"CERTAIN: {r['g']['resolver_certain'][0]}"}) + "\n"
                  for r in rows)
              pathlib.Path("perf.jsonl").write_text(perf)
              out = subprocess.run(
                  [sys.executable, "tools/grade_public.py",
                   str(bank), "perf.jsonl", "--strict"],
                  capture_output=True, text=True, check=True)
              d = json.loads(out.stdout)
              assert d["score"] == 1.0 and d["fabrication_rate"] == 0.0, (bank.name, d)
              assert d["coverage"] == 1.0 and d["duplicate_n"] == 0, (bank.name, d)
          print("parity: all banks 1.0 / 0.0 under strict, full coverage")
          PY
      - name: Required test fixtures present
        run: |
          test -f tests/fixtures/workflow_syn.yml
          test -f tests/fixtures/cert_syn.json
          test -f tests/fixtures/issuer_keys.json
          echo "fixtures present"
      - name: Adversarial suite (attack the measurement)
        run: python -m pytest tests/ -q
      - name: Exact recount is exact, not sampled
        run: |
          python tools/witness_recount.py tests/fixtures/specific_gate.yaml \
            report_test_success action_validators | tee rc.txt
          grep -q "6/30 = 0.200000 exactly" rc.txt
      - name: Certificate verifier (issued sample VALID end to end)
        run: |
          python tools/verify_certificate.py \
            examples/sample_certificate.json \
            --schema manifests/certificate.schema.v1.json \
            --issuer-keys .well-known/arcifact-issuer-keys.json \
            --banks banks --manifest-set examples/manifest_set.json \
            --manifest-dir banks \
            --revocation tests/fixtures/revocation.json \
            --profile issued | tee cv.json
          python - <<'PY'
          import json
          assert json.load(open("cv.json"))["verdict"] == "VALID"
          PY
